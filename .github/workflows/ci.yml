name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Java 21, MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Throwaway test database; the integration tests wipe and re-create its schema on every run.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: smartlib_test
          MYSQL_USER: smartlib
          MYSQL_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SMARTLIB_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/smartlib_test?serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
      SMARTLIB_DB_USERNAME: smartlib
      SMARTLIB_DB_PASSWORD: ci-test-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit, integration, security and architecture tests
        run: ./mvnw -B -ntp test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
